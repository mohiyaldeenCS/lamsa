name: Feature request
description: Propose a focused improvement.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or constraints
