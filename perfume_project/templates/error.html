{% extends "base.html" %}
{% block title %}{{ code or 'خطأ' }} | لَمْسَة{% endblock %}
{% block content %}
<section class="error-page"><div class="error-orbit"><span>{{ code or '!' }}</span></div><p class="eyebrow">تاه الأثر قليلًا</p><h1>{{ 'هذه الصفحة غير موجودة' if code == 404 else 'حدث أمر غير متوقع' }}</h1><p>{{ message }}</p><div><a class="button primary" href="{{ url_for('home') }}">العودة للرئيسية</a><a class="button secondary" href="{{ url_for('perfumes') }}">تصفح العطور</a></div></section>
{% endblock %}
