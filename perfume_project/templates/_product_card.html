<article class="product-card">
  <a class="product-art art-{{ (p.id % 5) + 1 }}" href="{{ url_for('perfume_detail', pid=p.id) }}" aria-label="عرض {{ p.name }}">
    <span class="bottle"><i></i><b>{{ (p.brand or 'لَمْسَة')[:1] }}</b></span>
    {% if p.stock <= 0 %}<span class="stock-badge sold">نفد</span>{% elif p.stock <= 5 %}<span class="stock-badge">متبقي {{ p.stock }}</span>{% endif %}
  </a>
  <div class="product-info"><p>{{ p.brand or 'لَمْسَة' }}</p><h3><a href="{{ url_for('perfume_detail', pid=p.id) }}">{{ p.name }}</a></h3><div class="product-meta"><strong>{{ p.price|sar }}</strong><form method="post" action="{{ url_for('add_to_cart', pid=p.id) }}">{{ empty_form.hidden_tag() }}<button type="submit" {% if p.stock <= 0 %}disabled{% endif %} aria-label="أضف {{ p.name }} إلى الحقيبة">＋</button></form></div></div>
</article>
